version: '3.8'

services:
  # LinkLog v2 - 当前稳定版本
  linklog-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linklog-v2
    ports:
      - "8003:8003"
    environment:
      - AI_BUILDER_TOKEN=${AI_BUILDER_TOKEN}
      - VERSION=v2.0.0
      - PORT=8003
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - linklog-network
    labels:
      - "com.linklog.version=v2"
      - "com.linklog.service=backend"

  # LinkLog v3 - 未来版本（预留）
  # linklog-v3:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: linklog-v3
  #   ports:
  #     - "8004:8003"
  #   environment:
  #     - AI_BUILDER_TOKEN=${AI_BUILDER_TOKEN}
  #     - VERSION=v3.0.0
  #     - PORT=8003
  #   volumes:
  #     - ./logs:/app/logs
  #   restart: unless-stopped
  #   networks:
  #     - linklog-network
  #   labels:
  #     - "com.linklog.version=v3"
  #     - "com.linklog.service=backend"
  #   profiles:
  #     - v3

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: linklog-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - linklog-v2
  #   restart: unless-stopped
  #   networks:
  #     - linklog-network

networks:
  linklog-network:
    driver: bridge

volumes:
  logs:

